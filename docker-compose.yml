version: '3.8'

services:
  backend:
    build: ./backend
    container_name: melodys-backend
    environment:
      - PORT=3001
      - DB_PATH=/data/melodys.db
      - JWT_SECRET=melodys_secret_key_2024
    volumes:
      - db-data:/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: melodys_nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/error_seguro.html:/usr/share/nginx/html/error_seguro.html:ro
    depends_on:
      - backend
      - frontend

  frontend:
    build: ./frontend
    container_name: melodys-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
    name: melodys-db-volume